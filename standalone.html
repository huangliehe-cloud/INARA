<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaBolt - Ultimate Video & MP3 Downloader (Vanilla)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#06b6d4',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080C14; color: #F1F5F9; }
    h1, h2, h3 { font-family: 'Syne', sans-serif; }
    .glow-cyan { box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#080C14]/90 backdrop-blur-md px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white">⚡</div>
      <span class="text-xl font-bold tracking-tight text-white">MediaBolt</span>
    </div>
    <span class="text-xs text-slate-400">Vanilla JS Edition</span>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl w-full mx-auto px-4 py-12 flex-1">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-white mb-2">Ultimate Video & <span class="text-cyan-400">MP3 Downloader</span></h1>
      <p class="text-slate-400 text-sm">Download TikTok videos without watermarks and YouTube videos or audio in high quality.</p>
    </div>

    <!-- Downloader Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 glow-cyan mb-8">
      <!-- Error Message -->
      <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl bg-red-950/80 border border-red-800 text-red-200 text-xs"></div>

      <!-- Form -->
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          id="urlInput"
          type="text" 
          placeholder="Paste YouTube or TikTok URL here..."
          class="flex-1 px-4 py-3.5 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
        />
        <button 
          id="fetchBtn"
          onclick="fetchMedia()" 
          class="px-6 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl text-sm transition-all whitespace-nowrap"
        >
          Fetch Video / Download
        </button>
      </div>

      <!-- Quick Test -->
      <div class="mt-3 flex items-center gap-2 text-xs text-slate-400">
        <span>Quick test:</span>
        <button onclick="setSample('https://www.youtube.com/watch?v=dQw4w9WgXcQ')" class="underline hover:text-cyan-300">YouTube Rickroll</button>
        <span>·</span>
        <button onclick="setSample('https://www.tiktok.com/@scout2015/video/6718335390845095173')" class="underline hover:text-cyan-300">TikTok Cute Dog</button>
      </div>

      <!-- Loading Spinner -->
      <div id="loadingBox" class="hidden mt-6 text-center">
        <div class="inline-block w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="mt-2 text-xs text-cyan-400">Connecting to media services...</p>
      </div>
    </div>

    <!-- Output Preview Block -->
    <div id="previewCard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex flex-col sm:flex-row gap-5 items-start pb-6 border-b border-slate-800">
        <img id="thumbImg" src="" alt="Thumbnail" class="w-full sm:w-56 aspect-video object-cover rounded-xl bg-black border border-slate-800" />
        <div class="flex-1">
          <span id="platformBadge" class="text-[11px] font-bold uppercase tracking-wider text-cyan-400"></span>
          <h2 id="videoTitle" class="text-lg font-bold text-white mt-1 mb-2"></h2>
          <p id="videoAuthor" class="text-xs text-slate-400"></p>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-sm font-semibold text-white mb-3">Available Formats</h3>
        <div id="formatGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    © MediaBolt. Clean web media utility.
  </footer>

  <script>
    function setSample(url) {
      document.getElementById('urlInput').value = url;
      fetchMedia();
    }

    async function fetchMedia() {
      const url = document.getElementById('urlInput').value.trim();
      const errorAlert = document.getElementById('errorAlert');
      const loadingBox = document.getElementById('loadingBox');
      const previewCard = document.getElementById('previewCard');

      errorAlert.classList.add('hidden');
      if (!url) {
        errorAlert.textContent = 'Please enter a YouTube or TikTok link.';
        errorAlert.classList.remove('hidden');
        return;
      }

      loadingBox.classList.remove('hidden');
      previewCard.classList.add('hidden');

      try {
        const res = await fetch('/api/fetch-info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Failed to fetch media');

        // Render preview
        document.getElementById('thumbImg').src = data.thumbnail;
        document.getElementById('videoTitle').textContent = data.title;
        document.getElementById('videoAuthor').textContent = 'By ' + data.author;
        document.getElementById('platformBadge').textContent = data.platform.toUpperCase() + (data.platform === 'tiktok' ? ' · STRICTLY NO WATERMARK' : ' · HIGH RESOLUTION');

        const grid = document.getElementById('formatGrid');
        grid.innerHTML = '';

        data.formats.forEach(format => {
          const card = document.createElement('div');
          card.className = 'p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between gap-3';
          card.innerHTML = `
            <div>
              <div class="text-xs font-semibold text-white">${format.label}</div>
              <div class="text-[11px] text-slate-400 font-mono">${format.quality}</div>
            </div>
            <button onclick="startDownload('${encodeURIComponent(format.downloadUrl || data.originalUrl)}', '${encodeURIComponent(data.title)}', '${format.ext}', '${format.id}', ${Boolean(format.needsConversion)})" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-semibold transition-colors">
              Download ${format.ext.toUpperCase()}
            </button>
          `;
          grid.appendChild(card);
        });

        previewCard.classList.remove('hidden');
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.remove('hidden');
      } finally {
        loadingBox.classList.add('hidden');
      }
    }

    async function startDownload(rawUrl, title, ext, formatId, needsConversion) {
      let targetUrl = decodeURIComponent(rawUrl);
      const cleanTitle = decodeURIComponent(title).replace(/[/\\?%*:|"<>#]/g, '').slice(0, 50);
      const filename = cleanTitle + '.' + ext;

      if (needsConversion) {
        try {
          const convRes = await fetch('/api/fetch-download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: targetUrl, formatId, ext })
          });
          const convData = await convRes.json();
          if (convData.downloadUrl) targetUrl = convData.downloadUrl;
        } catch(e) {}
      }

      const proxyUrl = `/api/proxy-download?url=${encodeURIComponent(targetUrl)}&filename=${encodeURIComponent(filename)}`;
      const a = document.createElement('a');
      a.href = proxyUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
